<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .tracking-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { 
            margin-top: 0; 
            color: #0f172a; 
            font-size: 24px;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2563eb; }
        
        /* Result Display Styles */
        #resultContainer {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            text-align: left;
        }
        .status-badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .update-time {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 5px;
        }
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="tracking-container">
        <h2>Track Your Order</h2>
        <p class="subtitle">Enter your Order ID to see the latest shipping updates.</p>
        
        <div class="search-box">
            <input type="text" id="trackId" placeholder="e.g. ORD-JULY-001">
            <button id="searchBtn">Track</button>
        </div>

        <div class="error-msg" id="errorMsg">Order not found. Please check your ID and try again.</div>

        <div id="resultContainer">
            <div class="status-badge">Current Status</div>
            <h3 id="displayStatus" style="margin: 10px 0; color: #0f172a;">--</h3>
            <div class="update-time" id="displayTime">Last updated: --</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // Your exact Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAHD0_l3t-aTEdlE_28Bspluk7KpL2GAbw",
            authDomain: "order-tracker-58390.firebaseapp.com",
            projectId: "order-tracker-58390",
            storageBucket: "order-tracker-58390.firebasestorage.app",
            messagingSenderId: "599840735038",
            appId: "1:599840735038:web:ce7938b2666e24d01c766f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('searchBtn').addEventListener('click', async () => {
            const trackId = document.getElementById('trackId').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const errorMsg = document.getElementById('errorMsg');
            
            // Reset UI
            resultContainer.style.display = 'none';
            errorMsg.style.display = 'none';

            if(!trackId) return;

            try {
                // Fetch the specific order document from Firestore
                const docRef = doc(db, "tracking", trackId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Format the timestamp into a readable date
                    const dateObj = new Date(data.lastUpdated);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { 
                        month: 'short', day: 'numeric', year: 'numeric', 
                        hour: 'numeric', minute: '2-digit' 
                    });

                    document.getElementById('displayStatus').innerText = data.status;
                    document.getElementById('displayTime').innerText = `Last updated: ${formattedDate}`;
                    
                    resultContainer.style.display = 'block';
                } else {
                    // Order ID doesn't exist in the database
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                console.error("Error fetching document: ", e);
                errorMsg.innerText = "Connection error. Please try again later.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
